spring.application.name=student-management-system
server.port=8080

# Default: H2 in-memory database, so the project runs without installing MySQL.
spring.datasource.url=jdbc:h2:mem:studentsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.thymeleaf.cache=false

# To use MySQL instead, comment the H2 datasource lines above and uncomment these:
# spring.datasource.url=jdbc:mysql://localhost:3306/student_management?createDatabaseIfNotExist=true
# spring.datasource.username=root
# spring.datasource.password=YOUR_MYSQL_PASSWORD
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.jpa.hibernate.ddl-auto=update
